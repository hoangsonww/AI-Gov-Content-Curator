apiVersion: v1
kind: Service
metadata:
  name: agentic-ai-api
  namespace: ai-curator
  labels:
    app.kubernetes.io/name: agentic-ai
    app.kubernetes.io/component: api
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: agentic-ai
    app.kubernetes.io/component: api
  ports:
    - name: http
      port: 80
      targetPort: http
      protocol: TCP
    - name: metrics
      port: 9090
      targetPort: http
      protocol: TCP
