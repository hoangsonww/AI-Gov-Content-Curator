# Azure Key Vault, GCP Secret Manager). Do NOT commit populated values.
apiVersion: v1
kind: Secret
metadata:
  name: agentic-ai-secrets
  namespace: ai-curator
  labels:
    app.kubernetes.io/name: agentic-ai
    app.kubernetes.io/component: secret
type: Opaque
stringData:
