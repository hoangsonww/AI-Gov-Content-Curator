apiVersion: v1
kind: ServiceAccount
metadata:
  name: agentic-ai
  namespace: ai-curator
  labels:
    app.kubernetes.io/name: agentic-ai
    app.kubernetes.io/component: serviceaccount
  annotations:
    # IAM-for-service-accounts: fill in per cloud
    # AWS:   eks.amazonaws.com/role-arn: arn:aws:iam::ACCOUNT:role/agentic-ai
    # Azure: azure.workload.identity/client-id: <client-id>
    # GCP:   iam.gke.io/gcp-service-account: agentic-ai@PROJECT.iam.gserviceaccount.com
automountServiceAccountToken: false
