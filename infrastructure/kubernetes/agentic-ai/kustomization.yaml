apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-curator

commonLabels:
  app.kubernetes.io/name: agentic-ai
  app.kubernetes.io/part-of: synthora

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment-api.yaml
  - deployment-mcp.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

images:
  - name: ghcr.io/synthora/agentic-ai
    newTag: latest
