apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: ai-curator

# `labels` (not the deprecated `commonLabels`). includeSelectors is false:
# every Deployment/Service here already declares explicit selectors, so we
# only stamp metadata labels and never mutate immutable selector fields.
labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/name: agentic-ai
      app.kubernetes.io/part-of: synthora

resources:
  - serviceaccount.yaml
  - configmap.yaml
  - secret.yaml
  - deployment-api.yaml
  - service.yaml
  - hpa.yaml
  - pdb.yaml
  - networkpolicy.yaml
  - servicemonitor.yaml

# Note: there is no MCP Deployment. The MCP server uses stdio transport
# (ADR 0002) and is launched on demand by an MCP client — it is not a
# long-running cluster workload. The shared image still ships
# `python -m mcp_server` for clients that run it in a container.

images:
  - name: ghcr.io/hoangsonww/ai-curator-agentic-ai
    newTag: latest
