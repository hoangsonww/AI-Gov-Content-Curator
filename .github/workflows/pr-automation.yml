name: PR Automation for SythoraAI 📊

# Auto-assigns the PR author, applies four standing triage labels,
# applies path-based labels driven by .github/labeler.yml, and assigns
# the latest open milestone.
#
# Uses pull_request_target so PRs from forks still get labeled. This job
# does NOT check out PR code, so the elevated token is safe.

on:
  pull_request_target:
    types: [opened, reopened, ready_for_review, synchronize]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: pr-automation-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  automate:
    name: Assign + label
    runs-on: ubuntu-latest
    if: github.event.pull_request.state == 'open'
    steps:
      - name: Assign PR to author
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const author = pr.user.login;

            // Bots can't be assignees. Skip.
            if (pr.user.type === 'Bot' || author.endsWith('[bot]')) {
              core.info(`Skipping assignment — author ${author} is a bot.`);
              return;
            }

            // Idempotent: addAssignees ignores users already assigned.
            await github.rest.issues.addAssignees({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              assignees: [author],
            });
            core.info(`Assigned PR #${pr.number} to ${author}.`);

      - name: Apply standing triage labels
        uses: actions/github-script@v7
        with:
          script: |
            const STANDING_LABELS = [
              'enhancement',
              'bug',
              'help wanted',
              'question',
            ];
            await github.rest.issues.addLabels({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              labels: STANDING_LABELS,
            });
            core.info(`Applied standing labels: ${STANDING_LABELS.join(', ')}`);

      - name: Apply path-based labels
        uses: actions/labeler@v5
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
          sync-labels: false

      - name: Assign latest milestone
        uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;

            // Don't override a milestone already set on the PR.
            if (pr.milestone) {
              core.info(`PR #${pr.number} already on milestone "${pr.milestone.title}".`);
              return;
            }

            const milestones = await github.paginate(
              github.rest.issues.listMilestones,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                state: 'open',
                per_page: 100,
              },
            );
            if (milestones.length === 0) {
              core.info('No open milestones — skipping milestone assignment.');
              return;
            }

            // "Latest" = the most recently created open milestone.
            const latest = milestones.sort(
              (a, b) => new Date(b.created_at) - new Date(a.created_at),
            )[0];

            await github.rest.issues.update({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: pr.number,
              milestone: latest.number,
            });
            core.info(`Set milestone "${latest.title}" on PR #${pr.number}.`);
