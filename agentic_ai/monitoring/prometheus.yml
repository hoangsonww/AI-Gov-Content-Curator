# Prometheus scrape config for the agentic pipeline + MCP server.
# The MCP server uses stdio transport, so Prometheus scraping requires a
# sidecar OR the metrics-port HTTP exporter exposed via the FastAPI `api`
# service. The OpenTelemetry Collector below also relays metrics if you
# prefer push-based collection.

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: synthora
    env: ${SYNTHORA_ENV:-development}

alerting:
  alertmanagers: []  # configure as needed

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: synthora-api
    metrics_path: /metrics
    scheme: http
    static_configs:
      # The FastAPI app serves /metrics on its main port (8000); there is
      # no separate metrics listener.
      - targets: ["api:8000"]
    relabel_configs:
      - target_label: component
        replacement: api

  - job_name: otel-collector
    metrics_path: /metrics
    static_configs:
      - targets: ["otel-collector:8888"]

  - job_name: prometheus-self
    static_configs:
      - targets: ["localhost:9090"]
