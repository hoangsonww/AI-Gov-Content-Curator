# OpenTelemetry Collector config (contrib distribution).
#
# Accepts OTLP traces + metrics on 4317 (gRPC) and 4318 (HTTP),
# batches them, and forwards to a downstream backend.
#
# Configure your backend below by uncommenting one of the exporters
# (Tempo / Jaeger / Honeycomb / Grafana Cloud / OTLP-compatible). The
# default config drops data, which is fine for local development.

receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

  prometheus/self:
    config:
      scrape_configs:
        - job_name: otel-collector
          scrape_interval: 30s
          static_configs:
            - targets: ["0.0.0.0:8888"]

processors:
  batch:
    timeout: 5s
    send_batch_size: 1024
    send_batch_max_size: 2048

  memory_limiter:
    check_interval: 5s
    limit_mib: 512
    spike_limit_mib: 128

  resource:
    attributes:
      - key: deployment.environment
        from_attribute: deployment.environment
        action: upsert

  attributes/redact:
    actions:
      - key: api_key
        action: delete
      - key: authorization
        action: delete
      - key: password
        action: delete

exporters:
  # Local debug. Replace with your real backend.
  debug:
    verbosity: basic

  # OTLP to a downstream collector / vendor (configure endpoint).
  # otlp/tempo:
  #   endpoint: tempo:4317
  #   tls:
  #     insecure: true

  # otlphttp/honeycomb:
  #   endpoint: https://api.honeycomb.io
  #   headers:
  #     x-honeycomb-team: ${HONEYCOMB_API_KEY}

service:
  telemetry:
    logs:
      level: info
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, resource, batch]
      exporters: [debug]
    metrics:
      receivers: [otlp, prometheus/self]
      processors: [memory_limiter, batch]
      exporters: [debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, attributes/redact, batch]
      exporters: [debug]
